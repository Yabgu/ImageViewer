<?xml version="1.0" encoding="UTF-8"?>
<!--
  ImageViewer application icon.

  Master artwork for every platform icon.  The Windows .ico is generated from
  this file by src/tools/make_icon.py; edit the SVG, never the .ico by hand.

  Design notes:
    * Dark rounded tile so the icon sits well on light and dark shells.
    * A high-key "photo" card keeps the silhouette readable down to 16 px.
    * The sky runs cyan -> indigo -> violet, and the strip along the bottom
      edge is a cyan/magenta checkerboard standing in for the temporal-dither
      ramp that is the app's core display feature.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#1D2B4C"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="dither" width="38" height="18"
             patternUnits="userSpaceOnUse" patternTransform="translate(104 374)">
      <rect width="38" height="18" fill="#F472B6"/>
      <rect width="19" height="9" fill="#22D3EE"/>
      <rect x="19" y="9" width="19" height="9" fill="#22D3EE"/>
    </pattern>
    <clipPath id="card">
      <rect x="104" y="120" width="304" height="272" rx="26"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="8"/>

  <!-- Photo card -->
  <rect x="88" y="104" width="336" height="304" rx="40" fill="#F8FAFC"/>

  <g clip-path="url(#card)">
    <rect x="104" y="120" width="304" height="272" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="196" cy="206" r="36" fill="#FDE68A"/>

    <!-- Ridges -->
    <path d="M104 392 L188 274 L286 392 Z" fill="#0B1220"/>
    <path d="M236 392 L326 250 L408 392 Z" fill="#182541"/>

    <!-- Dither ramp along the bottom edge -->
    <rect x="104" y="374" width="304" height="18" fill="url(#dither)"/>
  </g>
</svg>
