name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-native:
    name: Build (Linux / system libraries, no vcpkg)
    runs-on: [linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build-linux-native
          cd build-linux-native
          cmake .. -DIMAGEVIEWER_BUILD_VIEWER=OFF -G Ninja

      - name: Build
        run: cmake --build build-linux-native -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build-linux-native --output-on-failure

  build-mingw32:
    name: Build (Windows / MinGW-w64 / vcpkg)
    runs-on: [mingw32, linux, x64]
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x third-party/vcpkg/vcpkg ]; then
            mkdir -p third-party
            pushd third-party
            git clone https://github.com/microsoft/vcpkg --depth 1
            pushd vcpkg
            ./bootstrap-vcpkg.sh --disableMetrics
            popd
            popd
          fi

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ./prepare_mingw32.sh

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mingw32 -j"$(nproc)"

      - name: Package runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f iview-mingw32.zip

          # Zip only executable + runtime DLLs from the target output directory.
          (
            cd build-mingw32/src/imageviewer
            find . -maxdepth 1 -type f \( -name 'iview.exe' -o -name '*.dll' \) -print | sort | zip -9 -@ "$GITHUB_WORKSPACE/iview-mingw32.zip"
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iview-mingw32
          path: iview-mingw32.zip
          if-no-files-found: error

  build-windows-msvc:
    name: Build (Windows / MSVC / vcpkg)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path third-party/vcpkg/vcpkg.exe)) {
            New-Item -ItemType Directory -Force -Path third-party | Out-Null
            git clone https://github.com/microsoft/vcpkg --depth 1 third-party/vcpkg
            & "${{ github.workspace }}/third-party/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          }

      # No -G: CMake picks the newest installed Visual Studio generator, so the
      # job keeps working when the runner image moves to a newer VS.  The same
      # vcpkg manifest feeds this job, so the feature set (viewer + plugins) is
      # identical to the MinGW build.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -A x64 `
            -DIMAGEVIEWER_USE_VCPKG=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/third-party/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build-msvc --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-msvc -C Release --output-on-failure
