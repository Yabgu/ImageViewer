name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-native:
    name: Unit tests (native Linux)
    runs-on: ubuntu-latest
    env:
      VCPKG_DISABLE_METRICS: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p third-party
          pushd third-party
          git clone https://github.com/microsoft/vcpkg --depth 1
          pushd vcpkg
          ./bootstrap-vcpkg.sh --disableMetrics
          popd
          popd

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-native \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DIMAGEVIEWER_BUILD_VIEWER=OFF

      - name: Build unit tests
        run: |
          set -euo pipefail
          cmake --build build-native --target iview_tests -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build-native --output-on-failure -R iview_tests

  test-format:
    name: Format conversion tests (native Linux / vcpkg)
    runs-on: ubuntu-latest
    env:
      VCPKG_DISABLE_METRICS: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p third-party
          pushd third-party
          git clone https://github.com/microsoft/vcpkg --depth 1
          pushd vcpkg
          ./bootstrap-vcpkg.sh --disableMetrics
          popd
          popd

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-format \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DIMAGEVIEWER_BUILD_VIEWER=OFF

      - name: Build format tests
        run: |
          set -euo pipefail
          cmake --build build-format --target iview_format_tests -j"$(nproc)"

      - name: Run format conversion tests
        run: ctest --test-dir build-format --output-on-failure -R iview_format_tests

  build-mingw32:
    name: Build (Windows / MinGW-w64 / vcpkg)
    runs-on: [mingw32, linux, x64]
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x third-party/vcpkg/vcpkg ]; then
            mkdir -p third-party
            pushd third-party
            git clone https://github.com/microsoft/vcpkg --depth 1
            pushd vcpkg
            ./bootstrap-vcpkg.sh --disableMetrics
            popd
            popd
          fi

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ./prepare_mingw32.sh

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mingw32 -j"$(nproc)"

      - name: Package runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f iview-mingw32.zip

          # Zip only executable + runtime DLLs from the target output directory.
          (
            cd build-mingw32/src/imageviewer
            find . -maxdepth 1 -type f \( -name 'iview.exe' -o -name '*.dll' \) -print | sort | zip -9 -@ "$GITHUB_WORKSPACE/iview-mingw32.zip"
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iview-mingw32
          path: iview-mingw32.zip
          if-no-files-found: error
