name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-native:
    name: Build (Linux / system libraries, no vcpkg)
    runs-on: [linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build-linux-native
          cd build-linux-native
          cmake .. -DIMAGEVIEWER_BUILD_VIEWER=OFF -G Ninja

      - name: Build
        run: cmake --build build-linux-native -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build-linux-native --output-on-failure

  test-viewer-linux:
    name: Test (Linux / viewer + GUI E2E / SW render)
    runs-on: [linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GLFW and Xvfb
        run: |
          # On the Arch-Linux self-hosted runner image, install GLFW (X11 variant),
          # Xvfb and pytest if they are not already present.
          # --needed ensures this is a no-op when packages are already installed.
          pacman -Sy --noconfirm --needed glfw-x11 xorg-server-xvfb python python-pytest

      - name: Configure (viewer ON, system libs)
        run: |
          mkdir -p build-viewer
          cd build-viewer
          cmake .. -DIMAGEVIEWER_BUILD_VIEWER=ON -G Ninja

      - name: Build
        run: cmake --build build-viewer -j$(nproc)

      - name: Run C++ tests (format + dither, no display needed)
        run: |
          ctest --test-dir build-viewer \
                --output-on-failure \
                --exclude-regex iview_gui_tests

      - name: Run GUI E2E tests (software render via Xvfb + Mesa)
        run: |
          # Start a virtual framebuffer (headless X11 display).
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build-viewer \
                  --tests-regex iview_gui_tests \
                  --output-on-failure

          kill "$XVFB_PID" 2>/dev/null || true

      - name: Run Python converter tests
        run: |
          IWCONV_PATH="$(pwd)/build-viewer/src/tools/iwconv" \
            python -m pytest tests/ -v --tb=short

  build-mingw32:
    name: Build (Windows / MinGW-w64 / vcpkg)
    runs-on: [mingw32, linux, x64]
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x third-party/vcpkg/vcpkg ]; then
            mkdir -p third-party
            pushd third-party
            git clone https://github.com/microsoft/vcpkg --depth 1
            pushd vcpkg
            ./bootstrap-vcpkg.sh --disableMetrics
            popd
            popd
          fi

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ./prepare_mingw32.sh

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mingw32 -j"$(nproc)"

      - name: Package runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f iview-mingw32.zip

          # Zip only executable + runtime DLLs from the target output directory.
          (
            cd build-mingw32/src/imageviewer
            find . -maxdepth 1 -type f \( -name 'iview.exe' -o -name '*.dll' \) -print | sort | zip -9 -@ "$GITHUB_WORKSPACE/iview-mingw32.zip"
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iview-mingw32
          path: iview-mingw32.zip
          if-no-files-found: error
