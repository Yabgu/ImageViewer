name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-native:
    name: Build (Linux / system libraries, no vcpkg)
    runs-on: [linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build-linux-native
          cd build-linux-native
          cmake .. -DIMAGEVIEWER_BUILD_VIEWER=OFF -G Ninja

      - name: Build
        run: cmake --build build-linux-native -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build-linux-native --output-on-failure

  # Windows build with the *real* MSYS2 toolchain, run through LinSYS2
  # (https://github.com/wszqkzqk/LinSYS2: MSYS2 packages executed under Wine).
  #
  # This replaces the previous llvm-mingw + vcpkg cross-build.  There is no
  # Linux cross-compiler and no vcpkg here: clang, cmake, ninja and every
  # library are the clang64 MSYS2 packages, so compiler defaults, header layout
  # and runtime DLL layout match a Windows install instead of approximating it.
  # The job also *runs* the test binaries (under Wine) rather than only linking
  # them, which the cross-build could not do.
  #
  # The `mingw32` label is served by the self-hosted runner built from
  # ci/Containerfile.linsys2, which carries a prepared clang64 environment.
  # prepare_mingw32.sh and ci/Containerfile are left in the tree untouched: the
  # old path still works for anyone with llvm-mingw installed locally.
  build-windows-msys2:
    name: Build (Windows / MSYS2 clang64 / LinSYS2)
    runs-on: [self-hosted, mingw32, linux, x64]
    timeout-minutes: 60
    env:
      LINSYS2_ENV: clang64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Configure + build + run all three suites.  The script lives in the repo
      # (ci/build-msys2.sh) so this job and a local run are the same code path.
      - name: Configure, build, and test (MSYS2 under Wine)
        run: ./ci/build-msys2.sh

      - name: Package runtime artifacts
        run: ./ci/package-msys2.sh build-msys2 iview-msys2.zip

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iview-msys2
          path: iview-msys2.zip
          if-no-files-found: error

  build-windows-msvc:
    name: Build (Windows / MSVC / vcpkg)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path third-party/vcpkg/vcpkg.exe)) {
            New-Item -ItemType Directory -Force -Path third-party | Out-Null
            git clone https://github.com/microsoft/vcpkg --depth 1 third-party/vcpkg
            & "${{ github.workspace }}/third-party/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          }

      # No -G: CMake picks the newest installed Visual Studio generator, so the
      # job keeps working when the runner image moves to a newer VS.  The same
      # vcpkg manifest feeds this job, so the feature set (viewer + plugins) is
      # identical to the MinGW build.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -A x64 `
            -DIMAGEVIEWER_USE_VCPKG=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/third-party/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build-msvc --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-msvc -C Release --output-on-failure
