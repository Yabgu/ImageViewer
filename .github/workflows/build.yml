name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-native:
    name: Build (Linux / system libraries, no vcpkg)
    runs-on: [linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DIMAGEVIEWER_BUILD_VIEWER=ON -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run C++ tests (format + dither, no display needed)
        run: |
          ctest --test-dir build \
                --output-on-failure \
                --exclude-regex iview_gui_tests

      - name: Run GUI E2E tests (software render via Xvfb + Mesa)
        run: |
          # Some runners don't provide XDG_RUNTIME_DIR; GLFW may fail early.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # Start a virtual framebuffer (headless X11 display).
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            ctest --test-dir build \
                  --tests-regex iview_gui_tests \
                  --output-on-failure

          kill "$XVFB_PID" 2>/dev/null || true

      - name: Run Python converter tests
        run: |
          IWCONV_PATH="$(pwd)/build/src/tools/iwconv" \
            python -m pytest tests/ -v --tb=short

  build-mingw32:
    name: Build (Windows / MinGW-w64 / vcpkg)
    runs-on: [mingw32, linux, x64]
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x third-party/vcpkg/vcpkg ]; then
            mkdir -p third-party
            pushd third-party
            git clone https://github.com/microsoft/vcpkg --depth 1
            pushd vcpkg
            ./bootstrap-vcpkg.sh --disableMetrics
            popd
            popd
          fi

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ./prepare_mingw32.sh

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-mingw32 -j"$(nproc)"

      - name: Package runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f iview-mingw32.zip

          # Zip only executable + runtime DLLs from the target output directory.
          (
            cd build-mingw32/src/imageviewer
            find . -maxdepth 1 -type f \( -name 'iview.exe' -o -name '*.dll' \) -print | sort | zip -9 -@ "$GITHUB_WORKSPACE/iview-mingw32.zip"
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iview-mingw32
          path: iview-mingw32.zip
          if-no-files-found: error
